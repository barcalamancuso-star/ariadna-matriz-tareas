<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIZARRÓN DE TAREAS Y FRENTES // ARIADNA</title>
    <!-- Three.js para render espacial de fondo interactivo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-pizarra: #121418;
            --bg-panel: #161920;
            --bg-tarjeta: #1c202a;
            --bg-tarjeta-hover: #222734;
            --borde-tenue: #282f3d;
            --borde-foco: #4a5568;
            --tiza-hueso: #dedcd5;
            --tiza-apagada: #7e8794;
            --tiza-salvia: #88a88c;
            --tiza-celeste: #85a3b2;
            --tiza-ambar: #ded38e;
            --tiza-terracota: #c49d79;
            --font-mono: 'Space Mono', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-pizarra);
            color: var(--tiza-hueso);
            font-family: var(--font-mono);
            font-size: 11px;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Canvas Three.js en segundo plano (cuadrícula espacial didáctica) */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.35;
        }

        /* Contenedor UI principal por encima del canvas */
        .ui-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: rgba(18, 20, 24, 0.92);
            border-bottom: 1px solid var(--borde-tenue);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .header-title {
            font-size: 12px;
            letter-spacing: 1.5px;
            color: var(--tiza-hueso);
            font-weight: 700;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--borde-tenue);
            color: var(--tiza-hueso);
            font-family: var(--font-mono);
            font-size: 10px;
            padding: 4px 10px;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.15s ease;
        }

        .btn:hover {
            border-color: var(--tiza-hueso);
            background: rgba(222, 220, 213, 0.08);
        }

        .btn-accion {
            border-color: var(--tiza-celeste);
            color: var(--tiza-celeste);
        }

        .btn-accion:hover {
            background: rgba(133, 163, 178, 0.15);
        }

        /* Barra de frentes / filtros didácticos */
        .frentes-bar {
            background: rgba(22, 25, 32, 0.85);
            border-bottom: 1px solid var(--borde-tenue);
            padding: 6px 20px;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .frente-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--tiza-apagada);
            font-family: var(--font-mono);
            font-size: 9.5px;
            padding: 3px 8px;
            cursor: pointer;
            border-radius: 2px;
        }

        .frente-btn.active, .frente-btn:hover {
            color: var(--tiza-hueso);
            border-color: var(--borde-foco);
            background: rgba(255, 255, 255, 0.04);
        }

        /* Tablero tipo pizarra con 4 columnas */
        main.tablero {
            flex: 1;
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr 1fr;
            gap: 12px;
            padding: 12px 20px;
            overflow: hidden;
        }

        .columna-pizarra {
            background: rgba(22, 25, 32, 0.78);
            border: 1px solid var(--borde-tenue);
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(2px);
        }

        .col-encabezado {
            padding: 8px 12px;
            border-bottom: 1px solid var(--borde-tenue);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            background: rgba(18, 20, 24, 0.6);
        }

        .col-titulo-obligatorias { color: var(--tiza-terracota); }
        .col-titulo-proximas { color: var(--tiza-ambar); }
        .col-titulo-pendientes { color: var(--tiza-celeste); }
        .col-titulo-hechas { color: var(--tiza-salvia); }

        .contador {
            font-size: 8.5px;
            color: var(--tiza-apagada);
            border: 1px solid var(--borde-tenue);
            padding: 1px 5px;
            border-radius: 2px;
        }

        /* Lista de tarjetas con scroll suave */
        .lista-tarjetas {
            flex: 1;
            padding: 8px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .lista-tarjetas.drag-over {
            background: rgba(133, 163, 178, 0.08);
            border: 1px dashed var(--tiza-celeste);
        }

        /* Tarjeta contraída por defecto */
        .tarjeta {
            background: var(--bg-tarjeta);
            border: 1px solid var(--borde-tenue);
            border-left: 3px solid var(--tiza-apagada);
            border-radius: 2px;
            padding: 7px 9px;
            cursor: grab;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: all 0.12s ease;
        }

        .tarjeta:hover {
            background: var(--bg-tarjeta-hover);
            border-color: var(--borde-foco);
        }

        .tarjeta.dragging {
            opacity: 0.35;
            cursor: grabbing;
        }

        /* Indicador de tiza por prioridad */
        .tarjeta.p-CRITICA { border-left-color: var(--tiza-terracota); }
        .tarjeta.p-ALTA { border-left-color: var(--tiza-ambar); }
        .tarjeta.p-MEDIA { border-left-color: var(--tiza-celeste); }
        .tarjeta.p-BAJA { border-left-color: var(--tiza-apagada); }

        .tarjeta.hecha {
            opacity: 0.55;
            border-left-color: var(--tiza-salvia);
        }

        .tarjeta.hecha .tarjeta-titulo {
            text-decoration: line-through;
            color: var(--tiza-apagada);
        }

        .tarjeta-fila-sup {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tarjeta-frente {
            font-size: 8px;
            color: var(--tiza-apagada);
            letter-spacing: 0.5px;
        }

        .tiza-tag {
            font-size: 8px;
            padding: 1px 4px;
            border: 1px solid var(--borde-tenue);
            border-radius: 2px;
            cursor: pointer;
            color: var(--tiza-apagada);
        }

        .tiza-tag:hover {
            color: var(--tiza-hueso);
            border-color: var(--borde-foco);
        }

        .tarjeta-cuerpo {
            display: flex;
            align-items: flex-start;
            gap: 7px;
        }

        .check-box {
            margin-top: 2px;
            cursor: pointer;
            accent-color: var(--tiza-salvia);
        }

        .tarjeta-titulo {
            flex: 1;
            font-size: 10px;
            line-height: 1.35;
            color: var(--tiza-hueso);
        }

        /* Sección colapsable de notas/sub-tareas */
        .tarjeta-detalle {
            display: none;
            font-size: 8.5px;
            color: var(--tiza-apagada);
            padding-top: 4px;
            border-top: 1px dashed var(--borde-tenue);
            margin-top: 2px;
            line-height: 1.4;
        }

        .tarjeta.expandida .tarjeta-detalle {
            display: block;
        }

        .btn-toggle-detalle {
            background: transparent;
            border: none;
            color: var(--tiza-apagada);
            font-family: var(--font-mono);
            font-size: 8px;
            cursor: pointer;
            padding: 0 2px;
        }

        .btn-toggle-detalle:hover {
            color: var(--tiza-hueso);
        }

        /* Pie de página de estado */
        footer {
            background: rgba(18, 20, 24, 0.95);
            border-top: 1px solid var(--borde-tenue);
            padding: 5px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 8.5px;
            color: var(--tiza-apagada);
        }

        /* Modal simple de nueva tarea */
        .modal-fondo {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-caja {
            background: var(--bg-panel);
            border: 1px solid var(--borde-foco);
            padding: 16px;
            width: 360px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-radius: 2px;
        }

        .modal-caja input, .modal-caja select, .modal-caja textarea {
            background: var(--bg-pizarra);
            border: 1px solid var(--borde-tenue);
            color: var(--tiza-hueso);
            font-family: var(--font-mono);
            font-size: 10px;
            padding: 6px;
            outline: none;
        }

        .modal-caja input:focus, .modal-caja select:focus, .modal-caja textarea:focus {
            border-color: var(--tiza-celeste);
        }

        .modal-botones {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <!-- Lienzo espacial Three.js de fondo (rejilla de pizarrón sutil interactiva) -->
    <canvas id="bg-canvas"></canvas>

    <div class="ui-container">
        <header>
            <div class="header-title">PIZARRÓN DE TAREAS Y FRENTES // ARIADNA</div>
            <div class="header-controls">
                <span id="sync-indicador" style="font-size: 8.5px; color: var(--tiza-salvia);">ORIGEN: CARGANDO...</span>
                <button class="btn" onclick="toggleColapsoGlobal()">EXPANDIR / CONTRAER TODO</button>
                <button class="btn btn-accion" onclick="abrirModal()">+ NUEVO ITEM</button>
                <button class="btn" onclick="descargarJSON()">EXPORTAR JSON</button>
            </div>
        </header>

        <div class="frentes-bar">
            <span style="font-size: 8.5px; color: var(--tiza-apagada);">FRENTES:</span>
            <button class="frente-btn active" onclick="filtrarFrente('TODOS')">TODOS</button>
            <button class="frente-btn" onclick="filtrarFrente('ARIADNA CORE')">ARIADNA CORE</button>
            <button class="frente-btn" onclick="filtrarFrente('3D / VR / CAD')">3D / VR / CAD</button>
            <button class="frente-btn" onclick="filtrarFrente('FORENSE & TALLER')">FORENSE & TALLER</button>
            <button class="frente-btn" onclick="filtrarFrente('PERSONAL & DERECHO')">PERSONAL & DERECHO</button>
            <button class="frente-btn" onclick="filtrarFrente('OBRAS & CLIENTES')">OBRAS & CLIENTES</button>
        </div>

        <main class="tablero">
            <!-- COLUMNA 1: FRENTES ABIERTOS Y PENDIENTES -->
            <div class="columna-pizarra">
                <div class="col-encabezado">
                    <span class="col-titulo-pendientes">FRENTES ABIERTOS</span>
                    <span class="contador" id="cnt-pendientes">0</span>
                </div>
                <div class="lista-tarjetas" id="col-pendientes" ondragover="permitirDrop(event)" ondragleave="salirDrop(event)" ondrop="soltar(event, 'pendientes')"></div>
            </div>

            <!-- COLUMNA 2: PRÓXIMAS TAREAS (EN COLA) -->
            <div class="columna-pizarra">
                <div class="col-encabezado">
                    <span class="col-titulo-proximas">PRÓXIMAS EN COLA</span>
                    <span class="contador" id="cnt-proximas">0</span>
                </div>
                <div class="lista-tarjetas" id="col-proximas" ondragover="permitirDrop(event)" ondragleave="salirDrop(event)" ondrop="soltar(event, 'proximas')"></div>
            </div>

            <!-- COLUMNA 3: PRIORIDADES OBLIGATORIAS DIARIAS -->
            <div class="columna-pizarra">
                <div class="col-encabezado">
                    <span class="col-titulo-obligatorias">OBLIGATORIAS HOY</span>
                    <span class="contador" id="cnt-obligatorias">0</span>
                </div>
                <div class="lista-tarjetas" id="col-obligatorias" ondragover="permitirDrop(event)" ondragleave="salirDrop(event)" ondrop="soltar(event, 'obligatorias')"></div>
            </div>

            <!-- COLUMNA 4: REALIZADAS -->
            <div class="columna-pizarra">
                <div class="col-encabezado">
                    <span class="col-titulo-hechas">REALIZADAS</span>
                    <span class="contador" id="cnt-completadas">0</span>
                </div>
                <div class="lista-tarjetas" id="col-completadas" ondragover="permitirDrop(event)" ondragleave="salirDrop(event)" ondrop="soltar(event, 'completadas')"></div>
            </div>
        </main>

        <footer>
            <span>SISTEMA DE TIZAS DIDÁCTICO // CONTRAÍDO POR DEFECTO</span>
            <span id="clock-status">ARIADNA 3.0</span>
        </footer>
    </div>

    <!-- MODAL NUEVA TAREA -->
    <div class="modal-fondo" id="modalTarea">
        <div class="modal-caja">
            <span style="font-size: 10px; font-weight: 700; letter-spacing: 1px;">NUEVO FRENTE O TAREA</span>
            <input type="text" id="mTitulo" placeholder="Título de la tarea o frente...">
            <textarea id="mDetalle" rows="2" placeholder="Detalle o notas adicionales (opcional)..."></textarea>
            <select id="mFrente">
                <option value="ARIADNA CORE">ARIADNA CORE</option>
                <option value="3D / VR / CAD">3D / VR / CAD</option>
                <option value="FORENSE & TALLER">FORENSE & TALLER</option>
                <option value="PERSONAL & DERECHO">PERSONAL & DERECHO</option>
                <option value="OBRAS & CLIENTES">OBRAS & CLIENTES</option>
            </select>
            <select id="mPrioridad">
                <option value="CRITICA">CRÍTICA (TERRACOTA)</option>
                <option value="ALTA" selected>ALTA (ÁMBAR)</option>
                <option value="MEDIA">MEDIA (CELESTE)</option>
                <option value="BAJA">BAJA (TIZA GRIS)</option>
            </select>
            <select id="mColumna">
                <option value="pendientes">Frentes Abiertos</option>
                <option value="proximas">Próximas en Cola</option>
                <option value="obligatorias">Obligatorias Hoy</option>
            </select>
            <div class="modal-botones">
                <button class="btn" onclick="cerrarModal()">CANCELAR</button>
                <button class="btn btn-accion" onclick="guardarNueva()">GUARDAR</button>
            </div>
        </div>
    </div>

    <!-- LÓGICA DE DATOS Y THREE.JS -->
    <script>
        // --- 1. THREE.JS EN EL FONDO (Cuadrícula espacial didáctica) ---
        function initThreeBackground() {
            const canvas = document.getElementById("bg-canvas");
            const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 120;
            camera.position.y = 10;

            // Rejilla plana infinita de tiza
            const gridHelper = new THREE.GridHelper(260, 40, 0x3a4454, 0x1c212a);
            gridHelper.position.y = -40;
            gridHelper.rotation.x = 0.2;
            scene.add(gridHelper);

            // Partículas tenues flotantes de tiza
            const particlesCount = 80;
            const geom = new THREE.BufferGeometry();
            const positions = new Float32Array(particlesCount * 3);
            for (let i = 0; i < particlesCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 200;
                positions[i+1] = (Math.random() - 0.5) * 100;
                positions[i+2] = (Math.random() - 0.5) * 100;
            }
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: 0x7e8794, size: 1.2, transparent: true, opacity: 0.35 });
            const pSystem = new THREE.Points(geom, mat);
            scene.add(pSystem);

            function animate() {
                requestAnimationFrame(animate);
                gridHelper.rotation.y += 0.0003;
                pSystem.rotation.y += 0.0002;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // --- 2. LÓGICA DE TAREAS Y PIZARRÓN DIDÁCTICO ---
        const PRIORIDADES = ["CRITICA", "ALTA", "MEDIA", "BAJA"];
        let filtroActual = "TODOS";
        let colapsoGlobal = true;
        let tareas = [];

        async function cargarTareas() {
            try {
                const res = await fetch("tareas_maestras.json?t=" + Date.now());
                if (res.ok) {
                    tareas = await res.json();
                    document.getElementById("sync-indicador").innerText = "ORIGEN: tareas_maestras.json";
                    document.getElementById("sync-indicador").style.color = "var(--tiza-salvia)";
                    renderizar();
                    return;
                }
            } catch (e) {
                console.log("Modo local o sin fetch HTTP:", e);
            }

            const guardado = localStorage.getItem("ariadna_tareas_pizarron");
            if (guardado) {
                try { tareas = JSON.parse(guardado); } catch(err) {}
            }
            document.getElementById("sync-indicador").innerText = "ORIGEN: LOCAL";
            document.getElementById("sync-indicador").style.color = "var(--tiza-ambar)";
            renderizar();
        }

        function guardarLocal() {
            localStorage.setItem("ariadna_tareas_pizarron", JSON.stringify(tareas));
        }

        function renderizar() {
            const cols = {
                pendientes: document.getElementById("col-pendientes"),
                proximas: document.getElementById("col-proximas"),
                obligatorias: document.getElementById("col-obligatorias"),
                completadas: document.getElementById("col-completadas")
            };
            Object.values(cols).forEach(c => c.innerHTML = "");

            const contadores = { pendientes: 0, proximas: 0, obligatorias: 0, completadas: 0 };

            tareas.forEach(t => {
                if (contadores[t.column] !== undefined) contadores[t.column]++;

                if (filtroActual !== "TODOS" && t.frente !== filtroActual) return;

                const card = document.createElement("div");
                card.className = `tarjeta p-${t.priority} ${t.done ? 'hecha' : ''} ${!colapsoGlobal ? 'expandida' : ''}`;
                card.draggable = true;
                card.ondragstart = (e) => arrastrarInicio(e, t.id);
                card.ondragend = arrastrarFin;

                card.innerHTML = `
                    <div class="tarjeta-fila-sup">
                        <span class="tarjeta-frente">${t.frente}</span>
                        <div style="display:flex; gap:4px; align-items:center;">
                            <span class="tiza-tag" onclick="rotarPrioridad('${t.id}', event)">${t.priority}</span>
                            <button class="btn-toggle-detalle" onclick="toggleDetalle(this, event)">[+]</button>
                        </div>
                    </div>
                    <div class="tarjeta-cuerpo">
                        <input type="checkbox" class="check-box" ${t.done ? "checked" : ""} onclick="alternarHecho('${t.id}', event)">
                        <div class="tarjeta-titulo">${t.title}</div>
                    </div>
                    <div class="tarjeta-detalle">
                        <div>Fecha: ${t.date || '2026-09-04'} | ID: ${t.id}</div>
                        <div>${t.detalle || 'Frente activo sin observaciones adicionales.'}</div>
                    </div>
                `;

                if (cols[t.column]) cols[t.column].appendChild(card);
            });

            document.getElementById("cnt-pendientes").innerText = contadores.pendientes;
            document.getElementById("cnt-proximas").innerText = contadores.proximas;
            document.getElementById("cnt-obligatorias").innerText = contadores.obligatorias;
            document.getElementById("cnt-completadas").innerText = contadores.completadas;
        }

        function toggleDetalle(btn, event) {
            event.stopPropagation();
            const card = btn.closest(".tarjeta");
            card.classList.toggle("expandida");
            btn.innerText = card.classList.contains("expandida") ? "[-]" : "[+]";
        }

        function toggleColapsoGlobal() {
            colapsoGlobal = !colapsoGlobal;
            renderizar();
        }

        function rotarPrioridad(id, event) {
            event.stopPropagation();
            const t = tareas.find(x => x.id === id);
            if (!t) return;
            const idx = PRIORIDADES.indexOf(t.priority);
            t.priority = PRIORIDADES[(idx + 1) % PRIORIDADES.length];
            guardarLocal();
            renderizar();
        }

        function alternarHecho(id, event) {
            event.stopPropagation();
            const t = tareas.find(x => x.id === id);
            if (!t) return;
            t.done = !t.done;
            t.column = t.done ? "completadas" : "pendientes";
            guardarLocal();
            renderizar();
        }

        function filtrarFrente(frente) {
            filtroActual = frente;
            document.querySelectorAll(".frente-btn").forEach(b => {
                b.classList.toggle("active", b.innerText === frente);
            });
            renderizar();
        }

        // Drag & Drop
        let idArrastrado = null;
        function arrastrarInicio(e, id) {
            idArrastrado = id;
            e.target.classList.add("dragging");
            e.dataTransfer.setData("text/plain", id);
        }
        function arrastrarFin(e) {
            e.target.classList.remove("dragging");
            document.querySelectorAll(".lista-tarjetas").forEach(l => l.classList.remove("drag-over"));
        }
        function permitirDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.add("drag-over");
        }
        function salirDrop(e) {
            e.currentTarget.classList.remove("drag-over");
        }
        function soltar(e, colDestino) {
            e.preventDefault();
            e.currentTarget.classList.remove("drag-over");
            const id = idArrastrado || e.dataTransfer.getData("text/plain");
            const t = tareas.find(x => x.id === id);
            if (t) {
                t.column = colDestino;
                t.done = (colDestino === "completadas");
                guardarLocal();
                renderizar();
            }
        }

        // Modal
        function abrirModal() {
            document.getElementById("modalTarea").style.display = "flex";
            document.getElementById("mTitulo").focus();
        }
        function cerrarModal() {
            document.getElementById("modalTarea").style.display = "none";
            document.getElementById("mTitulo").value = "";
            document.getElementById("mDetalle").value = "";
        }
        function guardarNueva() {
            const tit = document.getElementById("mTitulo").value.trim();
            if (!tit) return;
            const det = document.getElementById("mDetalle").value.trim();
            const fre = document.getElementById("mFrente").value;
            const pri = document.getElementById("mPrioridad").value;
            const col = document.getElementById("mColumna").value;

            tareas.unshift({
                id: "t" + Date.now().toString().slice(-4),
                title: tit,
                detalle: det,
                frente: fre,
                priority: pri,
                column: col,
                done: false,
                date: new Date().toISOString().split("T")[0]
            });

            guardarLocal();
            renderizar();
            cerrarModal();
        }

        function descargarJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tareas, null, 2));
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", "tareas_maestras.json");
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        window.onload = () => {
            initThreeBackground();
            cargarTareas();
            setInterval(() => {
                if (window.location.protocol.startsWith("http")) cargarTareas();
            }, 6000);
        };
    </script>
</body>
</html>
